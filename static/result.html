<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>配当金シミュレーター — 結果</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Helvetica Neue', Arial, 'Hiragino Sans', sans-serif;
      background: #f0f6ff;
      color: #2d3748;
      min-height: 100vh;
      padding: 2rem 1rem;
    }
    .container { max-width: 1100px; margin: 0 auto; }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.2rem; color: #1a202c; }
    .subtitle { color: #718096; font-size: 0.88rem; margin-bottom: 0.6rem; }
    .fx-rate {
      display: inline-block;
      font-size: 0.8rem; color: #2b6cb0; font-weight: 600;
      background: #ebf8ff; border: 1px solid #bee3f8;
      border-radius: 6px; padding: 0.25rem 0.7rem;
      margin-bottom: 1.4rem;
    }

    /* サマリーカード */
    .summary-group { margin-bottom: 1.5rem; }
    .summary-label {
      font-size: 0.72rem; font-weight: 700; letter-spacing: 0.08em;
      text-transform: uppercase; color: #90cdf4;
      margin-bottom: 0.5rem; padding-left: 0.25rem;
    }
    .summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(175px, 1fr));
      gap: 0.75rem;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 1.1rem 1.3rem;
      box-shadow: 0 1px 6px rgba(66,153,225,0.10);
      border-left: 3px solid transparent;
    }
    .card.gross { border-left-color: #63b3ed; }
    .card.net   { border-left-color: #48bb78; }
    .card.plain { border-left-color: #bee3f8; }
    .card .label { font-size: 0.73rem; color: #718096; font-weight: 500; margin-bottom: 0.3rem; }
    .card .value { font-size: 1.35rem; font-weight: 700; color: #1a202c; }
    .card .value.blue  { color: #2b6cb0; }
    .card .value.green { color: #276749; }
    .card .sub { font-size: 0.72rem; color: #a0aec0; margin-top: 0.2rem; }

    /* 税引き前から手取りまでの流れ */
    .tax-flow-card { padding: 1.2rem 1.5rem; }
    .tax-flow-values {
      display: grid;
      grid-template-columns: minmax(150px, 1fr) 2rem minmax(150px, 1fr) 2rem minmax(150px, 1fr);
      align-items: center;
      gap: 0.8rem;
    }
    .tax-flow-step { min-width: 0; }
    .tax-flow-step.center { text-align: center; }
    .tax-flow-step.end { text-align: right; }
    .tax-flow-step .flow-label { font-size: 0.73rem; color: #718096; font-weight: 500; }
    .tax-flow-step .flow-value {
      margin-top: 0.2rem; font-size: 1.25rem; font-weight: 700;
      color: #2b6cb0; font-variant-numeric: tabular-nums;
    }
    .tax-flow-step.tax .flow-value { color: #c05621; }
    .tax-flow-step.net .flow-value { color: #276749; }
    .tax-flow-step .flow-sub { margin-top: 0.15rem; font-size: 0.7rem; color: #a0aec0; }
    .tax-flow-arrow {
      display: grid; place-items: center; width: 1.8rem; height: 1.8rem;
      border-radius: 50%; background: #ebf8ff; color: #4299e1;
      font-size: 1rem; font-weight: 700;
    }
    .tax-breakdown { margin-top: 1rem; }
    .tax-bar {
      display: flex; height: 0.55rem; overflow: hidden;
      border-radius: 999px; background: #e2e8f0;
    }
    .tax-bar-net { background: linear-gradient(90deg, #68d391, #48bb78); }
    .tax-bar-tax { background: #f6ad55; }
    .tax-legend {
      display: flex; justify-content: space-between; gap: 1rem;
      margin-top: 0.4rem; font-size: 0.7rem; color: #718096;
    }
    .tax-legend strong { color: #4a5568; }
    @media (max-width: 680px) {
      .tax-flow-values { grid-template-columns: 1fr; gap: 0.55rem; }
      .tax-flow-step.center, .tax-flow-step.end { text-align: left; }
      .tax-flow-arrow { transform: rotate(90deg); margin-left: 0.2rem; }
    }

    /* グラフエリア */
    .charts-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    @media (max-width: 680px) { .charts-row { grid-template-columns: 1fr; } }
    .chart-card {
      background: #fff;
      border-radius: 12px;
      padding: 1.25rem 1.4rem 1.5rem;
      box-shadow: 0 1px 6px rgba(66,153,225,0.10);
    }
    .chart-card h3 {
      font-size: 0.85rem; font-weight: 700; color: #2b6cb0;
      margin-bottom: 1rem; letter-spacing: 0.02em;
    }
    .chart-wrap { position: relative; }

    /* テーブル */
    .table-card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 1px 6px rgba(66,153,225,0.10);
      overflow-x: auto;
      margin-bottom: 1.5rem;
    }
    .table-card h2 {
      font-size: 0.9rem; font-weight: 600;
      padding: 0.9rem 1.25rem;
      border-bottom: 1px solid #ebf8ff;
      color: #2b6cb0;
    }
    table { width: 100%; border-collapse: collapse; font-size: 0.86rem; }
    th {
      text-align: left; padding: 0.6rem 0.9rem;
      background: #ebf8ff; color: #2c5282;
      font-size: 0.72rem; font-weight: 700;
      letter-spacing: 0.04em;
      border-bottom: 1px solid #bee3f8;
      white-space: nowrap;
    }
    td { padding: 0.65rem 0.9rem; border-bottom: 1px solid #f0f6ff; white-space: nowrap; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #f0f6ff; }
    .num { text-align: right; font-variant-numeric: tabular-nums; }
    .badge-none { background:#fed7d7; color:#c53030; border-radius:4px; font-size:0.68rem; padding:0.1rem 0.4rem; }
    .badge-ok   { background:#c6f6d5; color:#276749; border-radius:4px; font-size:0.68rem; padding:0.1rem 0.4rem; }
    .badge-jp   { background:#ebf8ff; color:#2b6cb0; border-radius:4px; font-size:0.65rem; padding:0.1rem 0.35rem; }
    .badge-us   { background:#fefcbf; color:#744210; border-radius:4px; font-size:0.65rem; padding:0.1rem 0.35rem; }
    .badge-nisa { background:#c6f6d5; color:#22543d; border-radius:4px; font-size:0.65rem; padding:0.1rem 0.35rem; font-weight:700; }
    .badge-partial { background:#e9d8fd; color:#553c9a; border-radius:4px; font-size:0.65rem; padding:0.1rem 0.35rem; font-weight:700; }
    .net-col { background: #f0fff4; }
    tr:hover .net-col { background: #e6ffed; }

    /* 注記 */
    .note {
      font-size: 0.78rem; color: #718096;
      background: #fff; border-radius: 8px;
      padding: 0.8rem 1.1rem; margin-bottom: 1.5rem;
      border: 1px solid #bee3f8; line-height: 1.7;
    }
    .note strong { color: #2b6cb0; }

    .empty {
      background: #fff; border-radius: 12px;
      padding: 3rem; text-align: center;
      color: #718096; box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }
    .btn-back {
      display: inline-block; padding: 0.5rem 1.5rem;
      background: #3182ce; color: #fff; border-radius: 8px;
      font-size: 0.88rem; font-weight: 600;
      text-decoration: none; margin-top: 1rem;
    }
    .btn-back:hover { background: #2b6cb0; }

    /* 月次/年次 トグル */
    .chart-card-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 1rem;
    }
    .chart-card-header h3 { margin-bottom: 0; }
    .toggle-group {
      display: flex; border: 1.5px solid #bee3f8; border-radius: 6px;
      overflow: hidden; flex-shrink: 0;
    }
    .toggle-btn {
      background: #fff; border: none; cursor: pointer;
      font-size: 0.75rem; font-weight: 600; color: #718096;
      padding: 0.25rem 0.65rem; transition: background 0.15s, color 0.15s;
    }
    .toggle-btn:first-child { border-right: 1px solid #bee3f8; }
    .toggle-btn.active { background: #3182ce; color: #fff; }

    .table-card { overflow: hidden; }
    .table-scroll { overflow-x: auto; }
    .scroll-hint { padding: 0.7rem 1.25rem; font-size: 0.8rem; color: #4a5568; }
    td:nth-child(2) { white-space: normal; min-width: 140px; max-width: 240px; overflow-wrap: anywhere; }
    th:first-child, td:first-child { position: sticky; left: 0; background: #fff; z-index: 1; }
    th:first-child { background: #ebf8ff; }
    .card .sub, .summary-label, .tax-flow-step .flow-sub { color: #4a5568; }
    @media(max-width:680px) { .chart-card-header { flex-wrap: wrap; gap: 0.7rem; } }
  </style>
</head>
<body>
<div class="container">
  <h1>配当金シミュレーター</h1>
  <p class="subtitle">マネーフォワードから取得したデータをもとに算出しています</p>
  <div id="fxRate"></div>
  <div id="app"><div class="empty">データを読み込み中…</div></div>
</div>

<script>
  function escapeHtml(value) {
    return String(value ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"}[c]));
  }
  function dateLabel(value) {
    return value ? escapeHtml(new Date(value).toLocaleString("ja-JP", {timeZone:"Asia/Tokyo"})) + " JST" : "不明";
  }
  function evidenceDescription(h) {
    const e = h.dividend_evidence;
    if (e) return `${e.publisher}：${e.basis}／資料確認日 ${e.checked_on}／再確認期限 ${e.review_after}`;
    if (h.yield_source === 'override') return '設定ファイルの過去実績利回り（設定日不明）';
    if (h.div_yield == null) return '未取得（0円と確認した意味ではありません）';
    return h.ticker && h.ticker.endsWith('.T')
      ? 'みんかぶ優先／Yahoo Finance補完（予想・実績が混在）'
      : 'Yahoo Finance 過去1年実績';
  }
  function evidenceLink(h) {
    const url = h.dividend_evidence?.source_url;
    return url && url.startsWith('https://')
      ? ` <a href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer">根拠資料</a>` : '';
  }
  function fmt(n) {
    return '¥' + Math.round(n).toLocaleString('ja-JP');
  }

  // ── カラーパレット（青・緑・白系）──────────────────────────
  const PALETTE = [
    '#4299e1','#48bb78','#63b3ed','#68d391',
    '#90cdf4','#9ae6b4','#3182ce','#38a169',
    '#bee3f8','#c6f6d5','#2b6cb0','#276749',
    '#76e4f7','#b2f5ea','#2c7a7b','#285e61',
  ];

  function shortName(name, code) {
    if (!name || name === code) return code || '—';
    return name.length > 12 ? name.slice(0, 11) + '…' : name;
  }

  function renderCharts(data) {
    // ── ① ポートフォリオ内訳（ドーナツ） ─────────────────────
    const sorted = [...data.holdings].sort((a, b) => b.value - a.value);
    const TOP = 10;
    const topH   = sorted.slice(0, TOP);
    const others = sorted.slice(TOP);
    const othersVal = others.reduce((s, h) => s + h.value, 0);

    const donutLabels = topH.map(h => shortName(h.name, h.code));
    const donutData   = topH.map(h => h.value);
    if (othersVal > 0) { donutLabels.push('その他'); donutData.push(othersVal); }

    const donutColors = donutLabels.map((_, i) =>
      i < donutLabels.length - 1 || othersVal === 0
        ? PALETTE[i % PALETTE.length]
        : '#e2e8f0'
    );

    new Chart(document.getElementById('chartDonut'), {
      type: 'doughnut',
      data: { labels: donutLabels, datasets: [{ data: donutData, backgroundColor: donutColors, borderColor: '#fff', borderWidth: 2, hoverOffset: 6 }] },
      options: {
        cutout: '62%',
        plugins: {
          legend: { position: 'right', labels: { font: { size: 11 }, boxWidth: 12, padding: 10, color: '#4a5568' } },
          tooltip: {
            callbacks: {
              label: ctx => {
                const total = ctx.dataset.data.reduce((a, b) => a + b, 0);
                const pct = (ctx.parsed / total * 100).toFixed(1);
                return ` ${fmt(ctx.parsed)}  (${pct}%)`;
              }
            }
          }
        }
      }
    });

    // ── ② 配当貢献度ランキング（横棒） ────────────────────────
    const withDiv = [...data.holdings]
      .filter(h => h.monthly_dividend_net != null && h.monthly_dividend_net > 0)
      .sort((a, b) => b.monthly_dividend_net - a.monthly_dividend_net)
      .slice(0, 15);

    const barLabels = withDiv.map(h => shortName(h.name, h.code));
    const barColors = withDiv.map(h =>
      h.ticker && h.ticker.endsWith('.T') ? '#63b3ed' : '#68d391'
    );

    const barDatasets = {
      monthly: {
        gross: withDiv.map(h => h.monthly_dividend),
        net:   withDiv.map(h => h.monthly_dividend_net),
      },
      annual: {
        gross: withDiv.map(h => (h.annual_dividend ?? h.monthly_dividend * 12)),
        net:   withDiv.map(h => (h.annual_dividend_net ?? h.monthly_dividend_net * 12)),
      }
    };

    const barWrap = document.getElementById('chartBar').parentElement;
    barWrap.style.height = (withDiv.length * 36 + 70) + 'px';

    window._barChart = new Chart(document.getElementById('chartBar'), {
      type: 'bar',
      data: {
        labels: barLabels,
        datasets: [
          {
            label: '税引き前',
            data: barDatasets.monthly.gross,
            backgroundColor: barColors.map(c => c + '55'),
            borderColor: barColors,
            borderWidth: 1.5,
            borderRadius: 3,
          },
          {
            label: '税引き後',
            data: barDatasets.monthly.net,
            backgroundColor: barColors,
            borderColor: barColors,
            borderWidth: 0,
            borderRadius: 3,
          }
        ]
      },
      options: {
        indexAxis: 'y',
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { position: 'top', labels: { font: { size: 11 }, boxWidth: 12, color: '#4a5568' } },
          tooltip: {
            callbacks: { label: ctx => ` ${ctx.dataset.label}: ${fmt(ctx.parsed.x)}` }
          }
        },
        scales: {
          x: {
            grid: { color: '#ebf8ff' },
            ticks: { callback: v => '¥' + v.toLocaleString('ja-JP'), font: { size: 10 }, color: '#718096' }
          },
          y: {
            grid: { display: false },
            ticks: { font: { size: 11 }, color: '#4a5568' }
          }
        }
      }
    });

    window._barDatasets = barDatasets;
  }

  function switchBarMode(mode) {
    const chart = window._barChart;
    const ds    = window._barDatasets;
    if (!chart || !ds) return;

    chart.data.datasets[0].data = ds[mode].gross;
    chart.data.datasets[1].data = ds[mode].net;
    chart.update();

    document.getElementById('btnMonthly').classList.toggle('active', mode === 'monthly');
    document.getElementById('btnAnnual').classList.toggle('active', mode === 'annual');
  }

  function render(data) {
    document.getElementById('fxRate').innerHTML = data.usd_jpy_rate
      ? `<div class="fx-rate">💴 参考為替レート: 1 USD = ¥${data.usd_jpy_rate.toFixed(2)}<br>出所：Yahoo Finance／取得：${dateLabel(data.fx_fetched_at)}</div>`
      : '';

    const portfolioYield = data.portfolio_dividend_yield != null
      ? Number(data.portfolio_dividend_yield).toFixed(2)
      : null;
    const annualGross = Number(data.total_annual_dividend) || 0;
    const annualNet = Number(data.total_annual_dividend_net) || 0;
    const annualTax = Math.max(annualGross - annualNet, 0);
    const takeHomeRateValue = annualGross > 0
      ? Math.min(annualNet / annualGross * 100, 100)
      : 0;
    const taxBurdenRateValue = 100 - takeHomeRateValue;
    const takeHomeRate = takeHomeRateValue.toFixed(1);
    const taxBurdenRate = taxBurdenRateValue.toFixed(1);

    const rows = data.holdings.map(h => {
      const isJP = h.tax_category ? h.tax_category === "JP" : !h.ticker || h.ticker.endsWith(".T");
      const taxBadge = h.monthly_dividend != null
        ? (h.nisa_status === 'partial'
            ? `<span class="badge-partial">一部NISA 実効 ${h.tax_rate}%</span>`
            : h.nisa_status === 'all'
              ? `<span class="badge-nisa">${isJP ? 'NISA 非課税' : 'NISA 米国源泉10%'}</span>`
              : isJP ? `<span class="badge-jp">JP ${h.tax_rate}%</span>`
                     : `<span class="badge-us">US ${h.tax_rate}%</span>`)
        : '';
      return `
        <tr>
          <td>${escapeHtml(h.code || '—')}</td>
          <td>${escapeHtml(h.name)}</td>
          <td class="num">${fmt(h.value)}</td>
          <td class="num" title="${escapeHtml(evidenceDescription(h))}">${h.div_yield != null
            ? `<span class="badge-ok">${h.div_yield === 0 ? '0%（無配・無分配実績）' : h.div_yield + ' %'}</span>${h.dividend_evidence ? evidenceLink(h) : ''}`
            : '<span class="badge-none">未取得（集計対象外）</span>'}</td>
          <td class="num">${h.monthly_dividend != null ? fmt(h.monthly_dividend) : '—'}</td>
          <td class="num net-col">${h.monthly_dividend_net != null ? fmt(h.monthly_dividend_net) : '—'}</td>
          <td>${taxBadge}</td>
        </tr>`;
    }).join('');

    document.getElementById('app').innerHTML = `
      <div class="note">計算日時：${dateLabel(data.calculated_at)}<br>
        保有残高の基準日時：${dateLabel(data.holdings_as_of)}（元データで確認してください）<br>
        未取得：${data.missing_yield_count ?? data.holdings.filter(h => h.div_yield == null).length}銘柄。未取得分の配当は合計に含みません。0円と確定した意味ではありません。<br>
        確認済み0円：${data.confirmed_zero_count ?? data.holdings.filter(h => h.div_yield === 0).length}銘柄（無配・無分配の実績。将来の0円を保証しません）。<br>
        投信内部で受け取る配当は、保有者への現金分配とは別です。無分配の投信に内部配当を重ねて加算しません。<br>
        月平均は年額÷12の概算で、実際の月別入金予定ではありません。
      </div>
      <div class="summary-group">
        <div class="summary-label">資産・配当サマリー（概算）</div>
        <div class="summary">
          <div class="card plain">
            <div class="label">総評価額</div>
            <div class="value">${fmt(data.total_value)}</div>
          </div>
          <div class="card net">
            <div class="label">年間配当合計（税引き後）</div>
            <div class="value green">${fmt(data.total_annual_dividend_net)}</div>
          </div>
          <div class="card net">
            <div class="label">月平均配当（税引き後）</div>
            <div class="value green">${fmt(data.total_monthly_dividend_net)}</div>
          </div>
          <div class="card plain">
            <div class="label">ポートフォリオ配当利回り（税引き前）</div>
            <div class="value">${portfolioYield ? portfolioYield + ' %' : '—'}</div>
            <div class="sub">利回り確認済み（評価額ベース）${data.yield_coverage_pct ?? '—'}%</div>
          </div>
        </div>
      </div>
      <div class="summary-group">
        <div class="summary-label">税引き前（参考）</div>
        <div class="summary">
          <div class="card gross tax-flow-card">
            <div class="tax-flow-values">
              <div class="tax-flow-step">
                <div class="flow-label">年間配当（税引き前）</div>
                <div class="flow-value">${fmt(annualGross)}</div>
                <div class="flow-sub">月平均 ${fmt(data.total_monthly_dividend)}</div>
              </div>
              <div class="tax-flow-arrow" aria-hidden="true">→</div>
              <div class="tax-flow-step tax center">
                <div class="flow-label">年間税負担（概算）</div>
                <div class="flow-value">▲ ${fmt(annualTax)}</div>
                <div class="flow-sub">税負担率 ${taxBurdenRate}%</div>
              </div>
              <div class="tax-flow-arrow" aria-hidden="true">→</div>
              <div class="tax-flow-step net end">
                <div class="flow-label">年間配当（税引き後）</div>
                <div class="flow-value">${fmt(annualNet)}</div>
                <div class="flow-sub">手取り率 ${takeHomeRate}%</div>
              </div>
            </div>
            <div class="tax-breakdown" aria-label="手取り率 ${takeHomeRate}%、税負担率 ${taxBurdenRate}%">
              <div class="tax-bar">
                <div class="tax-bar-net" style="width: ${takeHomeRateValue}%"></div>
                <div class="tax-bar-tax" style="width: ${taxBurdenRateValue}%"></div>
              </div>
              <div class="tax-legend">
                <span>手取り <strong>${takeHomeRate}%</strong></span>
                <span>税負担 <strong>${taxBurdenRate}%</strong></span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="charts-row">
        <div class="chart-card">
          <h3>📊 ポートフォリオ内訳（評価額）</h3>
          <div class="chart-wrap"><canvas id="chartDonut"></canvas></div>
        </div>
        <div class="chart-card">
          <div class="chart-card-header">
            <h3>📈 配当貢献度ランキング（税引き後）</h3>
            <div class="toggle-group">
              <button class="toggle-btn active" id="btnMonthly" onclick="switchBarMode('monthly')">月平均</button>
              <button class="toggle-btn" id="btnAnnual" onclick="switchBarMode('annual')">年次</button>
            </div>
          </div>
          <div class="chart-wrap"><canvas id="chartBar"></canvas></div>
        </div>
      </div>

      <div class="note">
        <details><summary>利回りの取得元・確認日時</summary>
          ${data.holdings.map(h => `<div>${escapeHtml(h.name)}：${escapeHtml(evidenceDescription(h))}${evidenceLink(h)}${h.dividend_evidence ? '' : '／取得確認 ' + dateLabel(h.dividend_checked_at)}</div>`).join('')}
        </details>
        <strong>税率の前提：</strong>
        日本株・国内ETF・国内投信 = 20.315%（所得税15.315% + 住民税5%）／
        米国株・米ETF = 28.28%（米国源泉10% + 国内20.315%・外国税額控除なしの概算）<br>
        同じ銘柄でもNISA分と課税口座分を分けて計算します。口座情報がない場合は登録済みの口座区分を使用します。<br>
        国内NISAは0%、米国株・米ETFのNISAは米国源泉10%で計算します。<br>
        利回りは国内銘柄のみんかぶ掲載値（予想・実績の区別は未取得）、Yahoo Financeの過去1年実績、設定ファイルの過去実績、出所と確認日を保存した無配・無分配実績が混在します。確認済み実績は再確認期限を過ぎると自動補完に使用しません。明細の利回りにカーソルを合わせると取得元を確認できます。<br>計算には丸め前の利回りと配当額を使用し、表示時に丸めるため明細と合計に端数差が生じます。未取得がある場合、全資産で割った利回りも不完全な参考値です。<br>※ 外国税額控除の適用、実際の権利日・支払日は考慮していません。上書き利回りは過去実績で、将来の分配を保証しません。
      </div>

      <div class="table-card">
        <h2>保有銘柄 一覧（${data.holdings.length} 銘柄）</h2>
        <p class="scroll-hint">左右にスクロールして金額・税率を確認できます。</p>
        <div class="table-scroll" tabindex="0" role="region" aria-label="保有銘柄明細（横スクロール）"><table>
          <thead>
            <tr>
              <th>コード</th>
              <th>銘柄名</th>
              <th class="num">評価額</th>
              <th class="num">配当利回り</th>
              <th class="num">月平均配当（税前）</th>
              <th class="num net-col">月平均配当（税後）</th>
              <th>税率</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table></div>
      </div>
      <a class="btn-back" href="/">← CSVアップロード画面に戻る</a>
    `;

    // DOM挿入後にChartを描画
    renderCharts(data);
  }

  const params = new URLSearchParams(location.search);
  const sid = params.get('s');

  if (sid) {
    fetch(`/api/session/${sid}`)
      .then(r => {
        if (!r.ok) throw new Error('セッションが見つかりません。拡張機能から再取得してください。');
        return r.json();
      })
      .then(data => render(data))
      .catch(e => {
        document.getElementById('app').innerHTML =
          `<div class="empty">${e.message}<br><a class="btn-back" href="/">← トップに戻る</a></div>`;
      });
  } else {
    document.getElementById('app').innerHTML = `
      <div class="empty">
        表示するデータがありません。<br>
        ブラウザ拡張からデータを取得してください。
        <br><a class="btn-back" href="/">← トップに戻る</a>
      </div>`;
  }
</script>
</body>
</html>
