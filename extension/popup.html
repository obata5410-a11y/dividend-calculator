<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 300px;
      font-family: 'Helvetica Neue', Arial, 'Hiragino Sans', sans-serif;
      font-size: 13px;
      color: #2d3748;
      margin: 0;
      padding: 0;
      background: #fff;
    }
    .header {
      background: #3182ce;
      color: #fff;
      padding: 12px 16px;
      font-weight: 700;
      font-size: 14px;
    }
    .header span { font-size: 11px; font-weight: 400; opacity: 0.85; display: block; margin-top: 2px; }
    .body { padding: 14px 16px; }

    .status {
      background: #f7fafc;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 10px 12px;
      margin-bottom: 12px;
      font-size: 12px;
      color: #4a5568;
      line-height: 1.6;
    }
    .status.ok   { background: #f0fff4; border-color: #9ae6b4; color: #276749; }
    .status.err  { background: #fff5f5; border-color: #feb2b2; color: #c53030; }
    .status.warn { background: #fffbeb; border-color: #fbd38d; color: #744210; }

    .steps {
      font-size: 11.5px;
      color: #4a5568;
      margin-bottom: 14px;
      line-height: 1.8;
      background: #f7fafc;
      border-radius: 6px;
      padding: 10px 12px;
    }
    .steps b { color: #2d3748; }
    .steps a { color: #3182ce; text-decoration: none; }
    .steps a:hover { text-decoration: underline; }

    button {
      width: 100%;
      padding: 9px;
      background: #3182ce;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover  { background: #2b6cb0; }
    button:disabled { background: #a0aec0; cursor: not-allowed; }

    .spinner {
      display: inline-block;
      width: 12px; height: 12px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .server-badge {
      display: inline-block;
      font-size: 10.5px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 20px;
      margin-top: 4px;
    }
    .server-badge.ok { background: #c6f6d5; color: #276749; }
    .server-badge.ng { background: #fed7d7; color: #c53030; }
    .server-badge.checking { background: #e2e8f0; color: #718096; }

    #ai-section { margin-top: 12px; }
    #ai-analyze-btn {
      background: #6b46c1;
    }
    #ai-analyze-btn:hover { background: #553c9a; }
    #ai-analyze-btn:disabled { background: #a0aec0; }
    #ai-result {
      margin-top: 8px;
      padding: 10px 12px;
      background: #faf5ff;
      border: 1px solid #d6bcfa;
      border-radius: 6px;
      font-size: 12px;
      line-height: 1.7;
      white-space: pre-wrap;
      color: #2d3748;
    }
    #ai-status {
      font-size: 11px;
      color: #718096;
      margin-top: 4px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    配当金シミュレーター
    <span>マネーフォワード ME 連携</span>
  </div>
  <div class="body">
    <div class="steps">
      <b>手順:</b><br>
      1. マネーフォワード ME にログイン<br>
      2. <b>資産 → <a href="https://moneyforward.com/bs/portfolio" target="_blank">資産内訳</a></b> を開く<br>
      3. 「株式（現物）」などの銘柄一覧が表示された状態で↓をクリック
    </div>
    <div style="margin-bottom:10px">
      <span class="server-badge checking" id="serverStatus">● サーバー 確認中…</span>
    </div>
    <div class="status" id="status">確認しています…</div>
    <button id="btn" disabled>データを取得して試算する</button>
    <div id="ai-section" style="display:none;">
      <button id="ai-analyze-btn">✨ AIでポートフォリオ分析</button>
      <div id="ai-status" style="display:none;"></div>
      <div id="ai-result" style="display:none;"></div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
